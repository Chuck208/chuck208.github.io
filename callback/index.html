<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla sign-in code</title>
<style>body{font-family:sans-serif;font-size:22px;padding:24px;line-height:1.5}textarea{width:100%;font-size:18px;font-family:monospace;height:140px}button{font-size:24px;padding:14px 22px;margin-top:16px;background:#1a73e8;color:#fff;border:0;border-radius:10px}#s{color:green;font-weight:bold}</style></head>
<body><h2>Almost done!</h2><p>Tap the blue button, then paste into Morgan's secure box.</p><textarea id="c" readonly></textarea><br><button id="b">Copy code</button><p id="s"></p>
<script>var p=new URLSearchParams(location.search);var t=document.getElementById('c');t.value=p.get('code')||('No code found. '+(p.get('error_description')||p.get('error')||''));
document.getElementById('b').onclick=function(){t.focus();t.select();t.setSelectionRange(0,99999);var ok=false;try{ok=document.execCommand('copy')}catch(e){}
if(navigator.clipboard){navigator.clipboard.writeText(t.value).then(function(){document.getElementById('s').textContent='Copied! Now paste it into Morgan.'},function(){document.getElementById('s').textContent=ok?'Copied! Now paste it into Morgan.':'Copy failed: press and hold the code above, then tap Copy.'})}else{document.getElementById('s').textContent=ok?'Copied! Now paste it into Morgan.':'Copy failed: press and hold the code above, then tap Copy.'}};</script></body></html>
